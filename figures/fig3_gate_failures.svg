<svg xmlns="http://www.w3.org/2000/svg" width="660" height="128" viewBox="0 0 660 128" role="img" aria-label="Gate failures"><rect x="0" y="0" width="660" height="128" fill="#fcfcfb"/>
      <g font-size="9" font-family="system-ui, sans-serif">
        <text x="185" y="18" text-anchor="end" fill="#0b0b0b">“A journal wouldn't accept it”</text>
        <rect x="195" y="8" width="420" height="12" rx="4" fill="#2a78d6"/>
        <text x="609" y="18" text-anchor="end" fill="#ffffff" font-weight="600">57</text>
        <text x="185" y="38" text-anchor="end" fill="#0b0b0b">“Someone already did it”</text>
        <rect x="195" y="28" width="361" height="12" rx="4" fill="#2a78d6"/>
        <text x="550" y="38" text-anchor="end" fill="#ffffff" font-weight="600">49</text>
        <text x="185" y="58" text-anchor="end" fill="#0b0b0b">“Doesn't hit a real bottleneck”</text>
        <rect x="195" y="48" width="206" height="12" rx="4" fill="#2a78d6"/>
        <text x="395" y="58" text-anchor="end" fill="#ffffff" font-weight="600">28</text>
        <text x="185" y="78" text-anchor="end" fill="#0b0b0b">“The causal story doesn't hold”</text>
        <rect x="195" y="68" width="199" height="12" rx="4" fill="#2a78d6"/>
        <text x="388" y="78" text-anchor="end" fill="#ffffff" font-weight="600">27</text>
        <text x="185" y="98" text-anchor="end" fill="#0b0b0b">“Too costly / too narrow a win”</text>
        <rect x="195" y="88" width="147" height="12" rx="4" fill="#2a78d6"/>
        <text x="336" y="98" text-anchor="end" fill="#ffffff" font-weight="600">20</text>
        <text x="185" y="118" text-anchor="end" fill="#0b0b0b">“Only works on one model”</text>
        <rect x="195" y="108" width="66" height="12" rx="4" fill="#2a78d6"/>
        <text x="255" y="118" text-anchor="end" fill="#ffffff" font-weight="600">9</text>
      </g>
    </svg>