<svg xmlns="http://www.w3.org/2000/svg" width="660" height="150" viewBox="0 0 660 150" role="img" aria-label="Documented success-rate drops"><rect x="0" y="0" width="660" height="150" fill="#fcfcfb"/>
      <!-- rows: label 190px, bars scale 91pt -> 420px -->
      <g font-size="9" font-family="system-ui, sans-serif">
        <!-- row 1 -->
        <text x="185" y="22" text-anchor="end" fill="#0b0b0b">Move the camera slightly</text>
        <rect x="195" y="12" width="420" height="14" rx="4" fill="#2a78d6"/>
        <text x="609" y="22" text-anchor="end" fill="#ffffff" font-weight="600">−91 pts</text>
        <text x="195" y="38" fill="#898781" font-size="8">UniVLA: 95.2% → 4.3% (LIBERO-Plus, arXiv 2510.13626)</text>
        <!-- row 2 -->
        <text x="185" y="60" text-anchor="end" fill="#0b0b0b">Start the robot arm elsewhere</text>
        <rect x="195" y="50" width="404" height="14" rx="4" fill="#2a78d6"/>
        <text x="593" y="60" text-anchor="end" fill="#ffffff" font-weight="600">−88 pts</text>
        <text x="195" y="76" fill="#898781" font-size="8">pi0: 94.2% → 6.6% (LIBERO-Plus)</text>
        <!-- row 3 -->
        <text x="185" y="98" text-anchor="end" fill="#0b0b0b">Vary the scene generally</text>
        <rect x="195" y="88" width="415" height="14" rx="4" fill="#2a78d6"/>
        <text x="604" y="98" text-anchor="end" fill="#ffffff" font-weight="600">−90 pts</text>
        <text x="195" y="114" fill="#898781" font-size="8">models above 90% collapse to 0% (LIBERO-PRO, arXiv 2510.03827)</text>
        <!-- row 4 -->
        <text x="185" y="136" text-anchor="end" fill="#0b0b0b">Long multi-step tasks, small model</text>
        <rect x="195" y="126" width="222" height="14" rx="4" fill="#2a78d6"/>
        <text x="411" y="136" text-anchor="end" fill="#ffffff" font-weight="600">−48 pts</text>
        <text x="425" y="136" fill="#898781" font-size="8">our SmolVLA 49.0% vs a 7B model's 97.1%</text>
      </g>
    </svg>