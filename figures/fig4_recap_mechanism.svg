<svg xmlns="http://www.w3.org/2000/svg" width="660" height="176" viewBox="0 0 660 176" role="img" aria-label="R4 mechanism diagram"><rect x="0" y="0" width="660" height="176" fill="#fcfcfb"/>
      <defs>
        <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52514e"/></marker>
      </defs>
      <g font-family="system-ui, sans-serif" font-size="9">
        <!-- frozen VLA -->
        <rect x="8" y="30" width="130" height="52" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.4"/>
        <text x="73" y="50" text-anchor="middle" fill="#0b0b0b" font-weight="600">SmolVLA 450M</text>
        <text x="73" y="64" text-anchor="middle" fill="#52514e">frozen — untouched</text>
        <!-- action chunk -->
        <line x1="138" y1="56" x2="186" y2="56" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>
        <text x="162" y="46" text-anchor="middle" fill="#898781" font-size="8">actions</text>
        <rect x="188" y="30" width="110" height="52" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.4"/>
        <text x="243" y="50" text-anchor="middle" fill="#0b0b0b" font-weight="600">Robot executes</text>
        <text x="243" y="64" text-anchor="middle" fill="#52514e">one sub-step</text>
        <!-- checker -->
        <line x1="298" y1="56" x2="346" y2="56" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>
        <rect x="348" y="24" width="150" height="64" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
        <text x="423" y="44" text-anchor="middle" fill="#0b0b0b" font-weight="600">Checkers (+1.5M)</text>
        <text x="423" y="58" text-anchor="middle" fill="#52514e">“did the drawer open?”</text>
        <text x="423" y="71" text-anchor="middle" fill="#52514e">“is the object gripped?”</text>
        <!-- pass -->
        <line x1="498" y1="46" x2="560" y2="46" stroke="#006300" stroke-width="1.4" marker-end="url(#arr)"/>
        <text x="530" y="38" text-anchor="middle" fill="#006300" font-weight="600" font-size="8.5">✓ passed</text>
        <rect x="562" y="30" width="90" height="34" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.4"/>
        <text x="607" y="51" text-anchor="middle" fill="#0b0b0b">next sub-step</text>
        <!-- fail path -->
        <line x1="423" y1="88" x2="423" y2="118" stroke="#d03b3b" stroke-width="1.4" marker-end="url(#arr)"/>
        <text x="452" y="106" fill="#d03b3b" font-weight="600" font-size="8.5">✗ failed</text>
        <rect x="330" y="120" width="186" height="34" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.4"/>
        <text x="423" y="141" text-anchor="middle" fill="#0b0b0b">scripted retreat → retry once</text>
        <line x1="330" y1="137" x2="243" y2="137" stroke="#52514e" stroke-width="1.4"/>
        <line x1="243" y1="137" x2="243" y2="84" stroke="#52514e" stroke-width="1.4" marker-end="url(#arr)"/>
        <text x="20" y="170" fill="#898781" font-size="8.5">Why it survived where 66 died: the retry changes the WORLD (the robot physically resets the situation) — it never has to trust corrupted perception twice in the same way.</text>
      </g>
    </svg>